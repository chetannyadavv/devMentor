services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devmentor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  # Sits between judge-worker and the real Docker socket. Only allows
  # container create/start/stop/logs/wait -- explicitly denies exec,
  # volume management, image building, swarm control. judge-worker never
  # gets raw access to /var/run/docker.sock.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    security_opt:
      - label:disable
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      EXEC: 0
      AUTH: 0
      SECRET: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SESSION: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build:
      context: .
      dockerfile: docker/images/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://devmentor:${POSTGRES_PASSWORD}@postgres:5432/devmentor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      PYTHONPATH: /app
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app:z
      - ./alembic.ini:/app/alembic.ini:z
      - ./migrations:/app/migrations:z

  judge-worker:
    build:
      context: .
      dockerfile: docker/images/judge-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://devmentor:${POSTGRES_PASSWORD}@postgres:5432/devmentor
      CELERY_BROKER_URL: redis://redis:6379/0
      # Talks to the socket-proxy, never the real socket directly.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SUBMISSIONS_LOCAL_DIR: /workspaces
      SUBMISSIONS_HOST_DIR: ${PWD}/judge_workspaces
    depends_on:
      - postgres
      - redis
      - docker-socket-proxy
    volumes:
      - ./app:/worker/app:z
      - ./runner:/worker/runner:z
      - ./judge_workspaces:/workspaces:z

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:z
      - prometheus_data:/prometheus
    depends_on:
      - api
      - judge-worker

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:z
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # The one public entry point. Automatic HTTPS via Let's Encrypt for a
  # real DOMAIN; falls back to a locally-trusted self-signed cert for
  # DOMAIN=localhost, so this works identically for local testing.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
